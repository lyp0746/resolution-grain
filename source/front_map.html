<h2 class="chapter">全书地图：一条原理，十一个量</h2>

<p class="lead">这本新版不是把旧书润色一遍，而是把旧的读数重新装进一个更清楚的骨架。先看两张地图：一张是推导链，一张是参数地图。看不懂公式的读者，可以先看框与箭头；看得懂公式的读者，可以拿它当索引。</p>

<figure>
<img src="assets/charts/v2_fig_principle.png" alt="一条原理、五个假设、一个泛函" style="width:100%">
<figcaption class="cap"><b>图0.1　一条原理，五个假设，一个泛函。</b>实线是推导：原理一 → 定义一—五 → 推论一—五 → 四个算子 → 一个泛函。虚线是五个建模假设（失真形状、线性响应、语义特征集、制度成本、核实技术），它们不藏在定理后面，单独画在下面。最下两行是边界：四层＝同一个泛函的四个约束，是网络不是阶梯，且只是形式类比。来源：本书；C 级（示意图，不是读数）。</figcaption>
</figure>

<figure>
<img src="assets/charts/v2_fig_parameters.png" alt="参数地图：一页看懂十一个量" style="width:100%">
<figcaption class="cap"><b>图0.2　参数地图：十一个量。</b>μ 是码围着什么建，v 是在那个位置上分多细；T+λ 与 w 决定 v*；C 是换码成本与迟滞；γ/A 是一致性压力与关系网；ν 是爱的范围与期限；κ/VOI 是好奇的峰位；I(q) 是切完能推出什么。每一格都是“看哪一只旋钮、往哪边动”，不是测量值。来源：本书；C 级。</figcaption>
</figure>

<p>两张图合起来，就是这本书的读法：先看“一条原理”能推到哪一步，再看“十一个量”各自在哪一章做功。后面每一部分，都会把其中的一两个量拿出来，配一个真实案例、一张杠杆表、一条判决线。</p>
