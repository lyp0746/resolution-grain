<div class="epigraph">
<p>“好料坏料不在漂亮，在你敢不敢照着它下锯。”</p>
<p class="src">——一位木匠看料时说的话</p>
<p>&nbsp;</p>
<p>一本讲“人为什么分得粗”的书，如果只让人少用两个词，它就失败了。<br>
它该做的，是让读者在每一次说“他就是这样的人”之前，先问一句：<br>
<b>他缩的是哪一头？</b></p>
<p>&nbsp;</p>
<p>第七天，那只手机被删掉了。<br>
删它的理由，和被装上的理由，是同一句话：<b>“它不懂我。”</b></p>
<p>&nbsp;</p>
<p>隔行如隔山，已经隔得太久。<br>
这本书不造一种共同的语言，只做一张对照表：<b>你那句话，在我这儿落在哪一格。</b><br>
塔搭不成，就把图纸留下。</p>
</div>
